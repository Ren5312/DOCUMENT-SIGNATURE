<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Document Signature Monitoring
    </title>


    <!-- CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >


    <!-- SUPABASE -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

</head>


<body>


<!-- ==========================================
     HEADER
========================================== -->

<header>

    <div>

        <h1>
            DOCUMENT'S FOR SIGNATURE
        </h1>

    </div>

</header>



<!-- ==========================================
     MAIN
========================================== -->

<main>


    <!-- ======================================
         STATISTICS
    ====================================== -->

    <section class="stats">


        <div class="card">

            <span>
                Total
            </span>

            <strong id="totalCount">
                0
            </strong>

        </div>



        <div class="card">

            <span>
                Pending
            </span>

            <strong id="pendingCount">
                0
            </strong>

        </div>



        <div class="card">

            <span>
                For Signature
            </span>

            <strong id="signatureCount">
                0
            </strong>

        </div>



        <div class="card">

            <span>
                Completed
            </span>

            <strong id="completedCount">
                0
            </strong>

        </div>


    </section>



    <!-- ======================================
         DOCUMENT MONITORING
    ====================================== -->

    <section class="monitoring">


        <div class="monitor-header">


            <h2>
                Document Monitoring
            </h2>


            <button
                class="add-btn"
                onclick="openAddModal()"
            >
                + Add Document
            </button>


        </div>



        <!-- SEARCH / FILTER -->

        <div class="filters">


            <input
                id="searchInput"
                type="text"
                placeholder="Search document name..."
                oninput="renderDocuments()"
            >



            <select
                id="statusFilter"
                onchange="renderDocuments()"
            >

                <option value="ALL">
                    All Status
                </option>

                <option value="PENDING">
                    Pending
                </option>

                <option value="FOR SIGNATURE">
                    For Signature
                </option>

                <option value="COMPLETED">
                    Completed
                </option>

            </select>


        </div>



        <!-- TABLE -->

        <div class="table-container">


            <table>


                <thead>

                    <tr>

                        <th>
                            Date
                        </th>

                        <th>
                            Document Name
                        </th>

                        <th>
                            School Year
                        </th>

                        <th>
                            Semester
                        </th>

                        <th>
                            Trusted By
                        </th>

                        <th>
                            Signatories
                        </th>

                        <th>
                            Received By
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>



                <tbody id="documentTable">

                </tbody>


            </table>


        </div>


    </section>


</main>



<!-- ==========================================
     ADD / EDIT MODAL
========================================== -->

<div
    id="modal"
    class="modal"
>


    <div class="modal-box">


        <!-- CLOSE -->

        <button
            class="close"
            onclick="closeModal()"
        >
            ×
        </button>



        <h2 id="modalTitle">
            Add Document
        </h2>



        <!-- ==================================
             DOCUMENT INFORMATION
        ================================== -->

        <div class="form-grid">


            <!-- DATE -->

            <div>

                <label>
                    Date
                </label>

                <input
                    type="date"
                    id="documentDate"
                >

            </div>



            <!-- DOCUMENT NAME -->

            <div>

                <label>
                    Document Name
                </label>

                <input
                    type="text"
                    id="documentName"
                    placeholder="Document name"
                >

            </div>



            <!-- SCHOOL YEAR -->

            <div>

                <label>
                    School Year
                </label>

                <input
                    type="text"
                    id="schoolYear"
                    placeholder="2026-2027"
                >

            </div>



            <!-- SEMESTER -->

            <div>

                <label>
                    Semester
                </label>

                <select id="semester">

                    <option value="">
                        Select Semester
                    </option>

                    <option value="1st Semester">
                        1st Semester
                    </option>

                    <option value="2nd Semester">
                        2nd Semester
                    </option>

                    <option value="Summer">
                        Summer
                    </option>

                </select>

            </div>



            <!-- TRUSTED BY -->

            <div>

                <label>
                    Trusted By
                </label>

                <input
                    type="text"
                    id="trustedBy"
                    placeholder="Trusted by"
                >

            </div>


        </div>



        <hr>



        <!-- ==================================
             SIGNATORIES
        ================================== -->

        <div class="signature-title">


            <div>

                <h3>
                    Signatories
                </h3>

                <p>
                    Each signatory has their own
                    date, time, receiving person,
                    and signed status.
                </p>

            </div>



            <button
                class="secondary-btn"
                onclick="addSignatory()"
            >
                + Add Signatory
            </button>


        </div>



        <!-- SIGNATORY ROWS -->

        <div
            id="signatoryContainer"
        ></div>



        <!-- ==================================
             MODAL BUTTONS
        ================================== -->

        <div class="modal-buttons">


            <button
                class="cancel-btn"
                onclick="closeModal()"
            >
                Cancel
            </button>



            <button
                class="save-btn"
                id="saveButton"
                onclick="saveDocument()"
            >
                Save Document
            </button>


        </div>


    </div>


</div>



<!-- JAVASCRIPT -->

<script src="script.js"></script>


</body>

</html>
